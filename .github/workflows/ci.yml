name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install current source
        run: python -m pip install -e ".[dev]"
      - name: Install browser for synthetic DOM tests
        run: python -m playwright install --with-deps chrome
      - name: Regression tests
        run: python -m pytest -q
      - name: Real stdio smoke test
        run: python scripts/smoke_mcp.py
      - name: Audit staged publication contents
        run: python scripts/public_release.py --git-index
      - name: Build validated source archive
        run: python scripts/package_plugin.py
