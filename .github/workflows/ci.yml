name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
        include:
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install current source
        run: python -m pip install -c requirements.lock -e ".[dev]"
      - name: Install browser for synthetic DOM tests
        run: python -m playwright install --with-deps chrome
      - name: Regression tests
        run: python -m pytest -q
      - name: Real stdio smoke test
        run: python scripts/smoke_mcp.py
      - name: Probe all contract profiles
        run: python scripts/benchmark_contracts.py --iterations 3
      - name: Audit staged publication contents
        run: python scripts/public_release.py --git-index
      - name: Build validated source archive
        run: python scripts/package_plugin.py
      - name: Build Windows student installer
        if: runner.os == 'Windows' && matrix.python == '3.13'
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python scripts/build_windows.py --wheel dist/edinburgh_study_agent-0.7.1-py3-none-any.whl
      - name: Verify bundled install without system Python
        if: runner.os == 'Windows' && matrix.python == '3.13'
        shell: pwsh
        run: |
          $uoePackage = Join-Path $env:RUNNER_TEMP 'UoE package'
          $uoePrivate = Join-Path $env:RUNNER_TEMP 'UoE student data'
          Expand-Archive -LiteralPath dist/UoE-Companion-0.7.1-Windows-x64.zip -DestinationPath $uoePackage
          $uoePayload = Join-Path $uoePackage 'UoE-Companion/payload'
          & (Join-Path $uoePayload 'runtime/Scripts/python.exe') -m edinburgh_study_agent.setup_core install --bundle $uoePayload --home $uoePrivate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
