[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "edinburgh-study-agent"
version = "0.7.1"
description = "UoE Companion: University of Edinburgh resources and personal workflows for AI agents"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["mcp>=1.30,<2", "jsonschema>=4.26,<5", "icalendar>=7.3,<8", "recurring-ical-events>=3.8,<4", "tzdata", "httpx>=0.28,<1", "playwright>=1.62,<2", "pypdf>=6.18,<7"]

[project.urls]
Repository = "https://github.com/saigyujikingyo-png/edinburgh-study-agent"
Issues = "https://github.com/saigyujikingyo-png/edinburgh-study-agent/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
edinburgh-study-agent = "edinburgh_study_agent.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
